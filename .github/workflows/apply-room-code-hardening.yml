name: Apply room-code hardening

on:
  push:
    branches:
      - security/room-codes
    paths:
      - '.room-code-hardening-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/room-codes
      - name: Increase room codes to six characters
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text()
          replacements = [
              ('maxlength="4" placeholder="ABCD"', 'maxlength="6" placeholder="ABC123"'),
              ('for(let i=0;i<4;i++)', 'for(let i=0;i<6;i++)'),
              ("if(code.length !== 4){ errEl.textContent = 'Enter the 4-character room code.'; return; }", "if(code.length !== 6){ errEl.textContent = 'Enter the 6-character room code.'; return; }")
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected index.html text not found: {old}')
              s = s.replace(old, new, 1)
          index.write_text(s)

          rules = Path('firestore.rules')
          r = rules.read_text()
          old = "roomCode.matches('^[A-HJ-NP-Z2-9]{4}$')"
          new = "roomCode.matches('^[A-HJ-NP-Z2-9]{6}$')"
          if old not in r:
              raise SystemExit('Expected firestore.rules room-code regex not found')
          rules.write_text(r.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html firestore.rules
          git diff --cached --exit-code && exit 0
          git commit -m 'Harden Duel Draw room codes'
          git push
