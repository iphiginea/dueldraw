name: Apply Duel Draw room creation compatibility fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-room-creation-direct.yml

permissions:
  contents: write

jobs:
  fix-room-creation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make room creation compatible with deployed rules
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text()

          s = s.replace('maxlength="6" placeholder="ABC123"', 'maxlength="6" placeholder="ABCD"')
          s = s.replace("function randCode(){\n  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no ambiguous chars\n  let s='';\n  for(let i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];\n  return s;\n}", "function randCode(length = 4){\n  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no ambiguous chars\n  let s='';\n  for(let i=0;i<length;i++) s += chars[Math.floor(Math.random()*chars.length)];\n  return s;\n}")

          old = '''document.getElementById('btn-create').onclick = async () => {
  const user = await authReady;
  const code = randCode();
  const playerId = user.uid;
  const room = {
    createdAt: Date.now(),
    hostId: playerId,
    guestId: null,
    status: 'waiting',
    drawerRole: 'host',
    round: 1,
    pool: shuffledIndices(PROMPTS.length),
    promptIndex: null,
    clues: ["","",""],
    cluesRevealed: 0,
    drawingData: "",
    guess: "",
    scores: { host:0, guest:0 }
  };
  await ROOMS.doc(code).set(room);
  session = { roomCode: code, playerId, role: 'host' };
  saveSession(session);
  document.getElementById('lobby-code').textContent = code;
  showScreen('lobby');
  listenRoom(code);
};'''

          new = '''document.getElementById('btn-create').onclick = async () => {
  const errEl = document.getElementById('home-error');
  errEl.textContent = '';
  try {
    const user = await authReady;
    const playerId = user.uid;
    const room = {
      createdAt: Date.now(),
      hostId: playerId,
      guestId: null,
      status: 'waiting',
      drawerRole: 'host',
      round: 1,
      pool: shuffledIndices(PROMPTS.length),
      promptIndex: null,
      clues: ["","",""],
      cluesRevealed: 0,
      drawingData: "",
      guess: "",
      scores: { host:0, guest:0 }
    };

    let code = null;
    let lastError = null;
    for (const length of [4, 6]) {
      const candidate = randCode(length);
      try {
        await ROOMS.doc(candidate).set(room);
        code = candidate;
        lastError = null;
        break;
      } catch (err) {
        lastError = err;
        if (err && err.code !== 'permission-denied') throw err;
      }
    }
    if (!code) throw lastError || new Error('Unable to create room');

    session = { roomCode: code, playerId, role: 'host' };
    saveSession(session);
    document.getElementById('lobby-code').textContent = code;
    showScreen('lobby');
    listenRoom(code);
  } catch (err) {
    console.error('Room creation failed:', err);
    errEl.textContent = 'Could not create a room. Please refresh and try again.';
  }
};'''

          if old not in s:
              raise SystemExit('Create-room block did not match current index.html')
          s = s.replace(old, new)
          s = s.replace("if(code.length !== 6){ errEl.textContent = 'Enter the 6-character room code.'; return; }", "if(code.length !== 4 && code.length !== 6){ errEl.textContent = 'Enter the 4- or 6-character room code.'; return; }")
          path.write_text(s)
          PY

      - name: Remove temporary files
        run: |
          rm .github/workflows/fix-room-creation-direct.yml
          rm -f .github/workflows/fix-room-creation.yml
          rm -f .room-creation-fix-trigger

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Duel Draw room creation compatibility"
          git push
